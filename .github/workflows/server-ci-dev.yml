name: Server CI - Development

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Lint code
        run: |
          pip install flake8 black
          black --check server/
          flake8 server/ --max-line-length=88

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v server/tests/
  
  build-server-dev-image:
    runs-on: ubuntu-latest
    needs: [run-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t server:develop .

      - name: Tag Image
        run: |
          docker tag server:develop ${{ secrets.DOCKER_USERNAME }}/server:develop

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/server:develop
