name: Server CI - Development

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - run: |
          pip install -r server/requirements.txt
          pip install flake8 black
          black --check server/
          flake8 server/ --max-line-length=88

  unit-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r server/requirements.txt
          pytest -v server/tests/

  security-scan:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
  
  build-server-dev-image:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, security-scan]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t server:develop -f server/DockerFile .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: server:develop
          severity: HIGH,CRITICAL
          exit-code: 1
          
      - name: Tag Image
        run: |
          docker tag server:develop ${{ secrets.DOCKER_USERNAME }}/server:develop

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/server:develop
