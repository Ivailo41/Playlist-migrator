name: Server CI - Production

on:
    pull_request:
        branches:
            - main

jobs:
    build-server-prod-image:
        runs-on: ubuntu-latest

        permissions:
          contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Docker Login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{  secrets.DOCKER_PASSWORD }}

            - name: Build Production Image
              run: |
                docker build -t server:latest -f server/DockerFile .

            - name: Scan Production Image with Trivy
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: server:latest
                severity: HIGH,CRITICAL
                exit-code: 1

            - name: Tag Production Image
              run: |
                docker tag server:latest ${{ secrets.DOCKER_USERNAME }}/server:latest

            - name: Push Production Image
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/server:latest